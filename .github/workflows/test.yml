name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hang fails in minutes, not at GitHub's 6 h default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check
      # The dev server e2e runs against tolerates things the production build
      # doesn't; until now only the deploy job ever ran it, after the merge.
      - run: npm run build
      # The packaged MCP server, installed and driven like a user would; catches a
      # bundling mistake before release day rather than on it.
      - run: npm run build:mcp
      - run: node scripts/smoke-mcp.mjs dist-mcp/d2-blocks-mcp.tgz
      # GitHub Actions sets CI=true, so playwright.config uses retries + starts
      # its own dev server rather than reusing one.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
