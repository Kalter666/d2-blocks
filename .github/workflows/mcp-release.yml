name: MCP release

# Push a tag mcp-v<version> (matching mcp/version.js) to publish the MCP server
# as a GitHub release asset. No npm registry account involved; users run it with
#   npx -y --package=https://github.com/Kalter666/d2-blocks/releases/latest/download/d2-blocks-mcp.tgz d2-blocks-mcp
on:
  push:
    tags: ['mcp-v*']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches mcp/version.js
        run: |
          v=$(node -p "require('fs').readFileSync('mcp/version.js','utf8').match(/VERSION = '(.+)'/)[1]")
          test "mcp-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but mcp/version.js says $v"; exit 1; }
      - run: npm test
      - run: npm run build:mcp
      # Installed and driven from an empty directory, as a user would.
      - run: node scripts/smoke-mcp.mjs dist-mcp/d2-blocks-mcp.tgz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-mcp/d2-blocks-mcp.tgz \
            --title "MCP server ${GITHUB_REF_NAME#mcp-}" \
            --notes "Run it with:

          \`\`\`sh
          claude mcp add d2-blocks -- npx -y --package=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/d2-blocks-mcp.tgz d2-blocks-mcp
          \`\`\`

          Or always the newest: replace \`releases/download/${GITHUB_REF_NAME}\` with \`releases/latest/download\`. See the README's MCP section."
